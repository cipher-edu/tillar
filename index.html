<!DOCTYPE html>
<html lang="uz" style="scroll-behavior: smooth;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NavDU Tillar Fakulteti — Oliy ta'lim, fan va innovatsiyalar vazirligi standarti</title>
    <meta
      name="description"
      content="Navoiy davlat universiteti Tillar fakulteti rasmiy veb-sayti: 7 kafedra, 3394 talaba, 148 professor-o'qituvchi."
    />
    <meta name="theme-color" content="#013d8c" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NavDU Tillar Fakulteti — Rasmiy Portal" />
    <meta property="og:description" content="Navoiy davlat universiteti Tillar fakulteti rasmiy veb-sayti" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            screens: { xs: '400px' },
            colors: {
              gov: {
                primary: '#013D8C',
                hover: '#002E69',
                h2: '#043B87',
                text: '#000000',
                deep: '#013D8C',
                navy: '#002E69',
                link: '#013D8C',
                secondary: '#707070',
                footer: '#013D8C',
                border: '#E1E1E1',
                soft: '#F0F0F0',
                muted: '#F8FAFC',
                stat: '#013D8C',
              },
            },
            fontFamily: {
              sans: ['Montserrat', '-apple-system', 'sans-serif'],
              serif: ['Georgia', 'serif'],
            },
            boxShadow: {
              gov: 'none',
              'gov-lg': 'none',
            },
            borderRadius: {
              DEFAULT: '0px',
              sm: '0px',
              md: '0px',
              lg: '0px',
              xl: '0px',
              '2xl': '0px',
              '3xl': '0px',
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-primary: #013D8C;
        --color-primary-dark: #002E69;
        --color-primary-hover: #002E69;
        --color-h2: #043B87;
        --color-text-primary: #000000;
        --color-secondary: #707070;
        --color-link: #013D8C;
        --color-footer: #013D8C;
        --color-bg-light: #F0F0F0;
        --color-box-blue: #F0F6FE;
        --color-border: #E1E1E1;
        --color-stat-border: #013D8C;
        --box-shadow: none;
        --radius: 0px;
        --transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
        --font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      html { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
      body {
        font-family: var(--font-family);
        background: #fff;
        color: #000000;
        margin: 0;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root { width: 100%; min-height: 100%; overflow-x: hidden; }
      a { color: inherit; text-decoration: none; }

      html[data-gov-theme='grayscale'] { filter: grayscale(100%); }
      html[data-gov-theme='contrast'] body { background: #000 !important; color: #ff0 !important; }
      html[data-gov-theme='contrast'] a,
      html[data-gov-theme='contrast'] button,
      html[data-gov-theme='contrast'] div,
      html[data-gov-theme='contrast'] span,
      html[data-gov-theme='contrast'] h1,
      html[data-gov-theme='contrast'] h2,
      html[data-gov-theme='contrast'] h3 {
        color: #ff0 !important;
        border-color: #ff0 !important;
        background: #000 !important;
      }

      .uz-flag-line {
        background: linear-gradient(
          180deg,
          #0099b5 0%, #0099b5 33%,
          #ce1126 33%, #ce1126 38%,
          #fff 38%, #fff 62%,
          #ce1126 62%, #ce1126 67%,
          #1eb53a 67%, #1eb53a 100%
        );
      }

      .gov-shell {
        width: 100%;
        max-width: 1440px;
        margin-left: auto;
        margin-right: auto;
        padding-left: max(1rem, env(safe-area-inset-left));
        padding-right: max(1rem, env(safe-area-inset-right));
      }
      @media (min-width: 640px) {
        .gov-shell { padding-left: 1.5rem; padding-right: 1.5rem; }
      }
      @media (min-width: 1024px) {
        .gov-shell { padding-left: 2rem; padding-right: 2rem; }
      }

      .gov-section {
        width: 100%;
        padding-top: clamp(2rem, 3.5vw, 3.5rem);
        padding-bottom: clamp(2rem, 3.5vw, 3.5rem);
      }

      /* Full-width hero — gov.uz style */
      .gov-hero {
        position: relative;
        width: 100vw;
        max-width: 100vw;
        margin-left: calc(50% - 50vw);
        margin-right: calc(50% - 50vw);
        min-height: clamp(560px, calc(100dvh - 128px), 920px);
        height: clamp(560px, calc(100dvh - 128px), 920px);
        box-sizing: border-box;
        background: var(--color-primary);
      }
      @media (max-width: 639px) {
        .gov-hero {
          height: auto;
          min-height: max(540px, calc(100svh - 108px));
          padding-bottom: 3.25rem;
        }
      }

      .gov-hero-gradient {
        background: linear-gradient(
          0deg,
          rgba(1, 61, 140, 0.88) 0%,
          rgba(1, 61, 140, 0.62) 42%,
          rgba(1, 61, 140, 0.38) 100%
        );
      }

      /* Primary blue — flat (gov.uz has no gradients) */
      .gov-gradient,
      .gov-btn-primary {
        background: var(--color-primary);
        color: #fff;
      }
      .gov-btn-primary {
        border: 1px solid var(--color-primary);
      }
      .gov-btn-primary:hover {
        background: transparent;
        color: var(--color-primary);
      }
      .gov-btn-green {
        background: var(--color-primary-dark);
        color: #fff;
        border: 1px solid var(--color-primary-dark);
      }
      .gov-btn-green:hover {
        background: transparent;
        color: var(--color-primary-dark);
      }

      .gov-card {
        background: #fff;
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        transition: var(--transition);
      }
      .gov-card:hover {
        border-color: var(--color-primary);
      }

      .gov-card-service {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #fff;
        border-bottom: 1px solid var(--color-border);
        border-right: 1px solid var(--color-border);
        transition: var(--transition);
        overflow: hidden;
      }
      .gov-card-service::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: transparent;
        transition: var(--transition);
      }
      .gov-card-service:hover {
        background: var(--color-box-blue);
        box-shadow: inset 0 0 0 1px rgba(0, 102, 204, 0.2);
      }
      .gov-card-service:hover::before { background: var(--color-primary); }

      .gov-stat-box {
        background: var(--color-box-blue);
        border: 1px solid var(--color-stat-border);
        border-radius: var(--radius);
        color: var(--color-text-primary);
        transition: var(--transition);
      }
      .gov-stat-box:hover {
        border-color: var(--color-primary);
        background: #fff;
      }
      .gov-stat-box--green {
        border-color: var(--color-primary);
        background: var(--color-box-blue);
      }

      .gov-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-weight: 600;
        font-size: 0.8rem;
        border-radius: var(--radius);
        transition: var(--transition);
        cursor: pointer;
        border: 1px solid transparent;
        line-height: 1.2;
      }
      .gov-btn-outline {
        background: transparent;
        color: #fff;
        border-color: rgba(255, 255, 255, 0.4);
      }
      .gov-btn-outline:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: #fff;
      }
      .gov-btn-ghost {
        background: var(--color-box-blue);
        color: var(--color-text-primary);
      }
      .gov-btn-ghost:hover {
        background: var(--color-primary);
        color: #fff;
      }

      .gov-section-head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 0.85rem 1rem;
        margin-bottom: clamp(1.25rem, 2.5vw, 1.75rem);
        padding-bottom: 0.85rem;
        border-bottom: 2px solid var(--color-primary);
      }
      @media (max-width: 639px) {
        .gov-section-head { flex-direction: column; align-items: stretch; }
        .gov-section-head .gov-btn { width: 100%; }
      }
      .gov-section-kicker {
        display: block;
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--color-primary);
        margin-bottom: 0.35rem;
      }
      .gov-section-title {
        margin: 0;
        font-size: clamp(1.1rem, 2.1vw, 1.65rem);
        font-weight: 700;
        text-transform: uppercase;
        color: var(--color-h2);
        line-height: 1.25;
      }

      .gov-link { color: var(--color-link); font-weight: 600; transition: var(--transition); }
      .gov-link:hover { text-decoration: underline; color: var(--color-primary); }

      .gov-pattern-soft {
        background-color: var(--color-bg-light);
        background-image: radial-gradient(circle at 1px 1px, rgba(1, 61, 140, 0.04) 1px, transparent 0);
        background-size: 22px 22px;
      }

      @keyframes gov-kenburns {
        0% { transform: scale(1.03); }
        100% { transform: scale(1.1) translate3d(-1%, -0.5%, 0); }
      }
      .gov-kenburns { animation: gov-kenburns 7s ease-out forwards; }

      @keyframes gov-fade-up {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .gov-fade-up { animation: gov-fade-up 0.5s ease both; }

      @keyframes gov-progress {
        from { width: 0%; }
        to { width: 100%; }
      }
      .gov-progress-fill {
        animation: gov-progress 6s linear forwards;
        background: #fff;
      }

      @keyframes gov-ticker {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-gov-ticker {
        display: flex;
        width: max-content;
        animation: gov-ticker 32s linear infinite;
      }
      .animate-gov-ticker:hover { animation-play-state: paused; }

      .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
      .scrollbar-none::-webkit-scrollbar { display: none; }

      ::-webkit-scrollbar { width: 7px; height: 7px; }
      ::-webkit-scrollbar-track { background: #f0f0f0; }
      ::-webkit-scrollbar-thumb { background: #013d8c; border-radius: 1px; }
      ::-webkit-scrollbar-thumb:hover { background: #021e44; }

      :focus-visible { outline: 3px solid #2f8ee2; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
