    <style>
      :root {
        --deep-blue: #09192f;
        --royal-teal: #0f2942;
        --parchment: #fdfaf3;
        --heritage: #fdfaf3;
        --gold: #d4af37;
        --gold-light: #fef08a;
        --antique-white: #f3eee6;
      }
      
      /* Custom Smooth Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
        border: 2px solid #f1f5f9;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      body {
        font-family: 'Cormorant Garamond', serif;
        background-color: var(--heritage);
        color: #0f172a;
        overflow-x: hidden;
      }

      .font-display {
        font-family: 'Playfair Display', serif;
      }
      h1, h2, h3, h4, .font-classic {
        font-family: 'Cinzel Decorative', 'Playfair Display', cursive;
      }
      .font-serif-classic {
        font-family: 'Cormorant Garamond', serif;
      }
      .font-ui {
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
      }

      /* Premium Gradients */
      .gold-gradient {
        background: linear-gradient(135deg, #b48a1d 0%, #d4af37 50%, #f59e0b 100%);
      }
      .gold-text-gradient {
        background: linear-gradient(135deg, #92400e 0%, #b48a1d 40%, #d4af37 70%, #f59e0b 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .royal-gradient {
        background: linear-gradient(135deg, #0b1d3a 0%, #0f2942 50%, #1e3a8a 100%);
      }

      /* Glassmorphism Styles */
      .glass-card {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(212, 175, 55, 0.22);
        box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.07);
      }
      .glass-card-dark {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(212, 175, 55, 0.3);
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.4);
      }

      .glow-amber {
        box-shadow: 0 0 35px -5px rgba(217, 119, 6, 0.3);
      }

      .parchment-texture {
        background-image: url("https://www.transparenttextures.com/patterns/p6.png");
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes pattern-shift {
        from { background-position: 0 0; }
        to { background-position: 1000px 1000px; }
      }
      .animated-pattern {
        animation: pattern-shift 120s linear infinite;
      }
      @keyframes marquee {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      .animate-marquee {
        animation: marquee 35s linear infinite;
      }
      @keyframes marquee-reverse {
        from { transform: translateX(-50%); }
        to { transform: translateX(0); }
      }
      .animate-marquee-reverse {
        animation: marquee-reverse 45s linear infinite;
      }
      @keyframes hero-kenburns {
        from { transform: scale(1.02) translate3d(0, 0, 0); }
        to { transform: scale(1.12) translate3d(-1.2%, -0.8%, 0); }
      }
      .hero-kenburns {
        animation: hero-kenburns 8.5s ease-out forwards;
        will-change: transform;
        transform-origin: center center;
      }
      .perspective-card {
        perspective: 1200px;
        transform-style: preserve-3d;
      }
      .program-card-3d {
        transform-style: preserve-3d;
        will-change: transform;
      }

      @media (prefers-reduced-motion: reduce) {
        .hero-kenburns,
        .animated-pattern,
        .animate-marquee,
        .animate-marquee-reverse {
          animation: none !important;
        }
        .perspective-card,
        .program-card-3d {
          transform: none !important;
        }
      }
